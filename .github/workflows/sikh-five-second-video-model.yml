name: "Free 5-second historical character video-model test"
on:
  push:
    branches: [experiment/free-generative-birth-shot]
    paths:
      - "sikh_studio/generative_birth_5s/**"
      - ".github/workflows/sikh-five-second-video-model.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local free client and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install "gradio_client>=1.3,<3"
      - name: One free text-to-video generation (no keys or credits)
        run: python sikh_studio/generative_birth_5s/generate.py
      - name: Package success video or precise failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-human-motion-five-second-test
          path: sikh_studio/generative_birth_5s/output/
          retention-days: 7
          if-no-files-found: warn
